  - platform: template
    id: cout_hier
    name: "Coût hier"
    device_class: monetary
    unit_of_measurement: "€"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // Inconnu si la valeur mémorisée ne se rapporte pas à hier
      // (coupure longue, minuit manqué) : on ne présente pas une vieille valeur.
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      auto jours = [](int a, int m, int j) -> int {
        a -= m <= 2;
        int ere = (a >= 0 ? a : a - 399) / 400;
        int ae = a - ere * 400;
        int jda = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + j - 1;
        return ere * 146097 + ae * 365 + ae / 4 - ae / 100 + jda - 719468;
      };
      // Hier = jour calendaire précédent (arithmétique de dates locales, sans fuseau)
      if (id(g_hier_jours) != jours(now.year, now.month, now.day_of_month) - 1) return NAN;
      return id(g_conso_hier_l) / 1000.0 * id(prix_m3).state;
  - platform: template
    id: cout_semaine
    name: "Coût cette semaine"
    device_class: monetary
    unit_of_measurement: "€"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // Inconnu si l'ancre mémorisée n'est pas celle de la semaine en cours
      // (plus de trame depuis plus d'une semaine) : la valeur serait fausse.
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      auto jours = [](int a, int m, int j) -> int {
        a -= m <= 2;
        int ere = (a >= 0 ? a : a - 399) / 400;
        int ae = a - ere * 400;
        int jda = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + j - 1;
        return ere * 146097 + ae * 365 + ae / 4 - ae / 100 + jda - 719468;
      };
      int lundi = jours(now.year, now.month, now.day_of_month) - (now.day_of_week + 5) % 7;
      if (id(g_week) != lundi) return NAN;
      if (!id(conso_semaine_l).has_state()) return 0.0f;
      return id(conso_semaine_l).state / 1000.0f * id(prix_m3).state;
  - platform: template
    id: cout_semaine_derniere
    name: "Coût semaine dernière"
    device_class: monetary
    unit_of_measurement: "€"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // Inconnu si la semaine mémorisée n'est pas celle qui précède la semaine
      // en cours (coupure de plusieurs semaines : la valeur couvrirait plus
      // qu'une semaine et ne peut pas être présentée comme « semaine dernière »).
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      auto jours = [](int a, int m, int j) -> int {
        a -= m <= 2;
        int ere = (a >= 0 ? a : a - 399) / 400;
        int ae = a - ere * 400;
        int jda = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + j - 1;
        return ere * 146097 + ae * 365 + ae / 4 - ae / 100 + jda - 719468;
      };
      int lundi = jours(now.year, now.month, now.day_of_month) - (now.day_of_week + 5) % 7;
      if (id(g_semaine_prec_lundi) != lundi - 7) return NAN;
      return id(g_conso_semaine_prec_l) / 1000.0 * id(prix_m3).state;
  - platform: template
    id: cout_mois_dernier
    name: "Coût mois dernier"
    device_class: monetary
    unit_of_measurement: "€"
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // Inconnu si le mois mémorisé n'est pas celui qui précède le mois en cours
      // (coupure de plusieurs mois : la valeur ne couvrirait pas le seul mois dernier).
      auto now = id(ha_time).now();
      if (!now.is_valid()) return NAN;
      if (id(g_mois_prec_cle) != now.year * 12 + now.month - 1) return NAN;
      return id(g_conso_mois_prec_l) / 1000.0 * id(prix_m3).state;

