# ══════════════════════════════════════════════════════════════════════════════
#  compteur-eau-lora : compteur d'eau Izar / DME (wM-Bus) → Home Assistant
#  Carte Heemol « Lora 32 V4 » : ESP32-S3 + SX1262 + OLED SSD1306 128x64
#
#  secrets.yaml requis :
#    wifi_ssid, wifi_password, fallback_hotspot_ssid, fallback_hotspot_password,
#    ota_password,
#    compteur0               (ton compteur, chaîne entre guillemets, ex. "0x12345678").
#  Facultatifs (absents = valeur par défaut) :
#    type_compteur           dme_07 (Grand Besançon, défaut), izar (Grand Belfort) ou auto
#    aes                     clé AES de ton compteur (absente ou "" = trames en clair)
#    compteur1 … compteur10  voisins : un voisin existe dès que son « compteurN » est présent,
#                            avec nomcompteurN, aesvN, typecompteurN facultatifs
#
#  Voisins : rien à écrire ici, voisins/voisins.yaml les lit dans secrets.yaml.
#  Voir README, « Voisins » et « Izar / DME ».
#
#  Export CSV : l'ESP n'écrit aucun fichier. Il envoie un évènement
#  « esphome.wmbus_trame » à Home Assistant pour chaque compteur entendu (connu
#  ou inconnu) ; HA ajoute la ligne au CSV avec notify.send_message (voir README.md).
# ══════════════════════════════════════════════════════════════════════════════

substitutions:
  # Toutes les entrées de secrets.yaml deviennent des substitutions : voisins, clés et type
  # facultatifs y sont testés (« absent = valeur par défaut »). Les valeurs restent masquées
  # dans « esphome config », comme avec !secret.
  <<: !include secrets.yaml
  # Numéro de TON compteur (secret compteur0, au format "0x12345678", entre guillemets).
  # Sert au récepteur wM-Bus et à l'écran 1 (affiché sans le « 0x »)
  num_compteur: !secret compteur0
  nom_moi: "Mon compteur"   # nom écrit dans le CSV pour ton propre compteur
  fuseau: "Europe/Paris"   # fuseau horaire de l'heure Internet (SNTP), utilisé si HA est arrêté
  bouton_pin: GPIO0        # bouton PRG de la carte (brochage Heltec V3/V4) : page suivante, réveil de l'écran
  # Police des pictogrammes (Material Design Icons, version figée)
  mdi_url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"

# ── Voisins (déduits de secrets.yaml : compteur1 … compteur10), clé AES et capteurs Izar de ton
#    compteur : tout passe par voisins/voisins.yaml, selon les entrées présentes dans secrets.yaml.
# Ajouter un voisin : compteurN (et nomcompteurN) dans secrets.yaml. Retirer : supprimer compteurN.
# Modèles (voisins/, options/) chargés depuis GitHub : aucun fichier à copier, ni en ligne de
# commande ni dans ESPHome Builder (issue #36). Ils ne contiennent aucun secret. Accès Internet
# nécessaire à la compilation. Hors ligne, ou avec des modèles modifiés : remplacer ce bloc par
#   voisins: !include voisins/voisins.yaml
# (voir README, « Voisins », option B).
packages:
  voisins:
    url: https://github.com/Mathilde-Team/Esphome-Compteur-wmbus
    ref: main            # ou un tag de version, pour figer les modèles
    refresh: 1d
    files: [voisins/voisins.yaml]

esphome:
  name: compteur-eau-lora
  friendly_name: Compteur Eau LoRa
  # Marqueur stable pour les intégrations Home Assistant (issue #47, Tarif-Eau) :
  # l'appareil apparaît avec le fabricant « mathilde-team » et le modèle
  # « compteur-eau-wmbus », quel que soit son nom. Contrat documenté dans le
  # README (« Marqueur stable pour les intégrations ») et vérifié par
  # tests/test_marqueur_integrations.py : ne pas renommer.
  project:
    name: mathilde-team.compteur-eau-wmbus
    version: "1.0.0"
  # Vext doit être allumé APRÈS le setup() de la sortie GPIO (priorité 800, qui la remet à l'arrêt)
  # et AVANT l'init de l'OLED (priorité 400) : d'où 799. À 800, l'OLED restait éteint (écran noir).
  # Liste (et non bloc unique) : chaque voisin y ajoute sa propre inscription (voisins/voisin.yaml).
  on_boot:
    - priority: 799
      then:
        - output.turn_on: vext_enable
        - lambda: delay(50);   // laisse l'alimentation de l'OLED se stabiliser avant son init

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Les évènements vers HA (export CSV) exigent, côté HA, la case « Autoriser l'appareil à
# effectuer des actions Home Assistant » (Paramètres > Appareils et services > ESPHome > ce
# compteur > Configurer).
api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_hotspot_ssid
    password: !secret fallback_hotspot_password
captive_portal:

# Deux sources d'heure qui règlent la MÊME horloge de l'ESP : id(ha_time).now() est valide dès
# que l'une des deux a répondu. Si Home Assistant est arrêté, l'heure Internet (SNTP) prend le
# relais : conso du jour, bascule de minuit et extinction nocturne de l'écran continuent.
# SNTP sans « id » : ESPHome le fusionne avec celui du paquet ntfy s'il est installé.
time:
  - platform: sntp
    timezone: ${fuseau}
  - platform: homeassistant
    id: ha_time
    on_time:
      # Chaque heure pile : conso de l'heure écoulée et détection de fuite
      - seconds: 0
        minutes: 0
        then:
          - lambda: |-
              double total = id(g_total);
              if (total <= 0) return;
              if (id(g_hour_start) <= 0) { id(g_hour_start) = total; return; }
              double liters = (total - id(g_hour_start)) * 1000.0;
              id(g_hour_start) = total;
              id(conso_heure_l).publish_state(liters);
              if (liters >= id(seuil_fuite_l).state) {
                id(g_leak_hours)++;
              } else {
                id(g_leak_hours) = 0;
                id(g_night_flag) = false;
              }
              int h = id(ha_time).now().hour;
              if (h == 5 && id(g_leak_hours) >= 3) id(g_night_flag) = true;
              id(heures_continues).publish_state(id(g_leak_hours));
      # Chaque jour à minuit : conso d'hier, puis les « conso aujourd'hui » repartent à 0.
      # Le « 1er index du jour » est mémorisé à la réception de la 1re trame de la nouvelle journée.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return;
              // La veille = 1 h avant minuit (jour de l'année de la journée qui vient de se terminer)
              int veille = ESPTime::from_epoch_local(now.timestamp - 3600).day_of_year;
              if (id(g_day) == veille && id(g_total) > 0 && id(g_day_start) > 0) {
                // Mémorisée aussi en global avec son jour : le coût d'hier survit à un
                // redémarrage, et devient « inconnu » si le jour attendu n'est plus celui-là
                // (coupure de plusieurs jours : la valeur ne peut pas être présentée comme hier).
                id(g_conso_hier_l) = (id(g_total) - id(g_day_start)) * 1000.0;
                // Jour de la journée terminée, en jours calendaires locaux (compteur pur de dates)
                auto finJour = ESPTime::from_epoch_local(now.timestamp - 3600);
                auto joursCal = [](int a, int m, int j) -> int {
                  a -= m <= 2;
                  int ere = (a >= 0 ? a : a - 399) / 400;
                  int ae = a - ere * 400;
                  int jda = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + j - 1;
                  return ere * 146097 + ae * 365 + ae / 4 - ae / 100 + jda - 719468;
                };
                id(g_hier_jours) = joursCal(finJour.year, finJour.month, finJour.day_of_month);
                id(conso_hier_l).publish_state(id(g_conso_hier_l));
              }
              id(conso_jour_l).update();
              // (chaque voisin met à jour sa propre conso du jour : voisins/voisin.yaml)


globals:
  - id: g_total          # dernier index reçu (m³)
    type: double
    initial_value: '0'
  - id: g_rx_ts          # heure de la dernière trame
    type: uint32_t
    initial_value: '0'
  - id: g_flow_total     # point de référence du calcul de débit
    type: double
    initial_value: '0'
  - id: g_flow_ts
    type: uint32_t
    initial_value: '0'
  - id: g_hour_start     # index au début de l'heure courante
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_day_start      # 1er index reçu dans la journée (référence de la conso du jour)
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_day            # jour de l'année auquel correspond g_day_start
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_week_start     # 1er index de la semaine (lundi) et semaine correspondante
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_week           # n° de jour du lundi de la semaine (jours depuis le 1/1/1970)
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_month_start    # 1er index du mois et mois correspondant (année × 12 + mois)
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_month
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_conso_hier_l    # conso d'hier (L), pour le coût d'hier
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_conso_semaine_prec_l  # conso de la semaine précédente (L)
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_conso_mois_prec_l     # conso du mois précédent (L)
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_hier_jours          # jour (jours depuis le 1/1/1970) auquel se rapporte g_conso_hier_l
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_semaine_prec_lundi  # lundi de la semaine mémorisée dans g_conso_semaine_prec_l
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_mois_prec_cle       # mois (année × 12 + mois) mémorisé dans g_conso_mois_prec_l
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_leak_hours     # heures consécutives avec conso
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_night_flag
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: g_page           # page affichée sur l'OLED : 0 = index, 1 = signaux, 2 = alertes
    type: int
    initial_value: '0'
  - id: g_ecran_eteint   # vrai pendant l'extinction nocturne
    type: bool
    initial_value: 'false'
  - id: g_reveil_ms      # écran rallumé par le bouton jusqu'à cet instant (millis)
    type: uint32_t
    initial_value: '0'
  - id: g_pause_ms       # rotation automatique suspendue jusqu'à cet instant (après un appui)
    type: uint32_t
    initial_value: '0'

  # ── Voisins (tables remplies au démarrage par chaque voisins/voisin.yaml) ──
  - id: g_voisins        # n° de compteur → numéro du voisin (1 à 10)
    type: std::map<uint32_t, int>
  - id: g_v_infos        # numéro du voisin → nom, index (m³) et conso du jour (L)
    type: std::map<int, std::function<void(std::string &, double &, double &)>>

  # ── Export CSV ──
  - id: g_id_off         # emplacement du n° de compteur dans l'en-tête des trames (4 ou 6), appris tout seul
    type: int
    restore_value: yes
    initial_value: '4'
  - id: g_csv_last       # n° de compteur → instant (s depuis le démarrage) du dernier évènement envoyé
    type: std::map<uint32_t, uint32_t>
  - id: g_ev_nom         # valeurs préparées pour l'évènement envoyé à HA
    type: std::string
    initial_value: '""'
  - id: g_ev_index
    type: std::string
    initial_value: '""'
  - id: g_ev_conso
    type: std::string
    initial_value: '""'

# Vext (GPIO36, actif à l'état bas) : alimente l'OLED et l'étage RF
output:
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    id: vext_enable

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_common, wmbus_radio, wmbus_meter]

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

# Bus I2C de l'OLED intégré (SDA 17 / SCL 18). 400 kHz : rafraîchissement bien plus rapide
i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz
  scan: false   # le scan se fait avant l'allumage de Vext : il ne verrait pas l'OLED

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14
  busy_pin: GPIO13
  rx_gain: BOOSTED
  rf_switch: true
  has_tcxo: true
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm  %s"
            args: [ frame->rssi(), frame->as_hex().c_str() ]

        # ── Export CSV : n° de CHAQUE compteur entendu (connu ou inconnu) → script envoi_trame ──
        - lambda: |-
            if (!id(csv_actif).state) return;

            // 1) Lecture de l'en-tête de la trame : L, C, M, M puis le champ « adresse » (6 octets)
            std::string hex = frame->as_hex();
            uint8_t d[10];
            int n = 0, hi = -1;
            for (char ch : hex) {
              int v = (ch >= '0' && ch <= '9') ? ch - '0' :
                      (ch >= 'a' && ch <= 'f') ? ch - 'a' + 10 :
                      (ch >= 'A' && ch <= 'F') ? ch - 'A' + 10 : -1;
              if (v < 0) continue;
              if (hi < 0) { hi = v; continue; }
              d[n++] = (uint8_t) ((hi << 4) | v);
              hi = -1;
              if (n == 10) break;
            }
            if (n < 10) return;

            // 2) Deux emplacements possibles pour le n° de compteur (octets 4-7 ou 6-9, petit-boutiste)
            uint32_t id_a = (uint32_t) d[4] | ((uint32_t) d[5] << 8) | ((uint32_t) d[6] << 16) | ((uint32_t) d[7] << 24);
            uint32_t id_b = (uint32_t) d[6] | ((uint32_t) d[7] << 8) | ((uint32_t) d[8] << 16) | ((uint32_t) d[9] << 24);

            // 3) Compteur connu ? (le tien = case 0, voisins = 1 à 10, table g_voisins). Un compteur
            //    connu qui retombe sur l'un des deux emplacements fixe celui à utiliser pour les inconnus.
            const uint32_t mien = (uint32_t) strtoul("${num_compteur}", nullptr, 16);
            auto &voisins = id(g_voisins);
            auto slot_de = [&](uint32_t n) -> int {
              if (n == mien) return 0;
              auto v = voisins.find(n);
              return v != voisins.end() ? v->second : -1;
            };
            int slot = slot_de(id_a);
            uint32_t idn = 0;
            if (slot >= 0) { idn = id_a; id(g_id_off) = 4; }
            else if ((slot = slot_de(id_b)) >= 0) { idn = id_b; id(g_id_off) = 6; }
            else idn = (id(g_id_off) == 6) ? id_b : id_a;

            // 4) Une ligne au maximum par compteur et par intervalle (nombre « Export CSV - intervalle »)
            uint32_t maintenant = millis() / 1000;
            uint32_t pause = (uint32_t) id(csv_intervalle_min).state * 60;
            auto &dernier = id(g_csv_last);
            auto it = dernier.find(idn);
            if (it != dernier.end() && (maintenant - it->second) < pause) return;
            if (it == dernier.end() && dernier.size() >= 64) dernier.clear();   // garde-fou mémoire
            dernier[idn] = maintenant;

            // 5) Envoi (le script attend 2 s que wmbus_meter ait décodé l'index des compteurs connus)
            char buf[9];
            snprintf(buf, sizeof(buf), "%08X", (unsigned int) idn);
            int rssi = (int) frame->rssi();
            // Famille d'après la version de l'en-tête (octet 8 si le n° est aux octets 4-7) :
            // 0x78 = Izar (type_compteur: izar), 0x7b = DME (dme_07). Aide au choix de type_compteur.
            uint8_t version = d[8];
            const char *famille = (id(g_id_off) != 4) ? "?" : version == 0x78 ? "Izar" : version == 0x7b ? "DME" : "autre";
            ESP_LOGD("csv", "Compteur %s (%s, %s, version %02X) RSSI %d dBm | en-tete %02X%02X%02X%02X %02X%02X%02X%02X%02X%02X",
                     buf, slot >= 0 ? "connu" : "inconnu", famille, version, rssi,
                     d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7], d[8], d[9]);
            id(envoi_trame).execute(std::string(buf), rssi, slot);

# Ton compteur (compteur0). Les voisins sont déclarés par voisins/voisin.yaml (« packages: »).
# NB : meter_id doit être un nombre précis (pas de joker) : ESPHome ne peut donc décoder l'index
# QUE des compteurs déclarés. Les autres compteurs ne remontent que leur n° et leur RSSI.
wmbus_meter:
  - id: mon_compteur
    meter_id: ${num_compteur}
    type: ${ type_compteur | default('dme_07') }   # secrets.yaml : dme_07, izar ou auto
    mode: [T1]

# ───────────────────────── Envoi d'un évènement vers Home Assistant ─────────────────────────
script:
  # Page suivante de l'écran (rotation automatique et bouton) : la page « alertes » est sautée
  # s'il n'y a aucune alerte
  - id: page_suivante
    then:
      - lambda: |-
          bool alerte = id(bs_fuite_confirmee).state || id(bs_fuite_nuit).state ||
                        id(bs_debit_anormal).state || id(bs_conso_jour).state ||
                        id(bs_absence).state || id(bs_silencieux).state;
          int suivante = (id(g_page) + 1) % 3;
          if (suivante == 2 && !alerte) suivante = 0;
          id(g_page) = suivante;
  - id: envoi_trame
    mode: parallel
    parameters:
      p_id: string      # n° de compteur (8 chiffres hexadécimaux)
      p_rssi: int       # RSSI de la trame (dBm)
      p_slot: int       # -1 = inconnu, 0 = mon compteur, 1 à 10 = voisins
    then:
      - delay: 2s       # laisse wmbus_meter décoder la trame et mettre l'index à jour
      - lambda: |-
          auto now = id(ha_time).now();
          // Conso du jour = index courant − 1er index reçu aujourd'hui ; 0 par défaut
          auto conso_l = [&](int jour, double total, double debut) -> double {
            if (!now.is_valid() || jour != now.day_of_year || total <= 0 || debut <= 0) return 0.0;
            return (total - debut) * 1000.0;
          };
          std::string nom;
          double total = 0, conso = 0;
          if (p_slot == 0) {
            nom = "${nom_moi}"; total = id(g_total); conso = conso_l(id(g_day), id(g_total), id(g_day_start));
          } else if (p_slot > 0) {
            auto v = id(g_v_infos).find(p_slot);   // voisin : nom, index et conso fournis par voisins/voisin.yaml
            if (v != id(g_v_infos).end()) v->second(nom, total, conso);
          }
          id(g_ev_nom) = nom;
          if (p_slot >= 0) {
            char b[16];
            snprintf(b, sizeof(b), "%.3f", total);
            id(g_ev_index) = b;
            snprintf(b, sizeof(b), "%.0f", conso);
            id(g_ev_conso) = b;
          } else {
            // compteur inconnu : ESPHome ne sait pas décoder son index
            id(g_ev_index) = "";
            id(g_ev_conso) = "";
          }
      - homeassistant.event:
          event: esphome.wmbus_trame
          data:
            compteur: !lambda 'return p_id;'
            nom: !lambda 'return id(g_ev_nom);'
            statut: !lambda 'return p_slot >= 0 ? "connu" : "inconnu";'
            rssi_dbm: !lambda 'return std::to_string(p_rssi);'
            index_m3: !lambda 'return id(g_ev_index);'
            conso_jour_l: !lambda 'return id(g_ev_conso);'


sensor:
  - platform: wmbus_meter
    parent_id: mon_compteur
    field: total_m3
    id: eau_total
    name: "Compteur eau - Volume total"
    device_class: water
    state_class: total_increasing
    unit_of_measurement: "m³"   # écrit en dur : le composant publie « m3 », refusé par le tableau de bord Énergie
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            double total = x;
            id(g_total) = total;   // mémorisé tout de suite : l'écran affiche l'index même sans l'heure
            auto now = id(ha_time).now();
            if (!now.is_valid()) {
              ESP_LOGW("conso", "Heure non synchronisée avec HA : conso du jour non calculée (0 L)");
              return;
            }
            uint32_t ts = (uint32_t) now.timestamp;
            id(g_rx_ts) = ts;
            // 1er index du jour : 1re trame reçue aujourd'hui (ou index revenu en arrière = compteur remplacé)
            if (id(g_day) != now.day_of_year || id(g_day_start) <= 0 || total < id(g_day_start)) {
              id(g_day_start) = total;
              id(g_day) = now.day_of_year;
              ESP_LOGI("conso", "1er index du jour (jour %d) : %.3f m3", now.day_of_year, total);
            }
            ESP_LOGD("conso", "Conso du jour : %.0f L (index %.3f - 1er index %.3f)",
                     (total - id(g_day_start)) * 1000.0, total, id(g_day_start));
            id(conso_jour_l).update();
            // Semaine (du lundi) et mois : même principe que le jour (1er index reçu de la période)
            auto jours = [](int a, int m, int j) -> int {   // jours depuis le 1/1/1970, date locale
              a -= m <= 2;
              int ere = (a >= 0 ? a : a - 399) / 400;
              int ae = a - ere * 400;
              int jda = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + j - 1;
              return ere * 146097 + ae * 365 + ae / 4 - ae / 100 + jda - 719468;
            };
            int lundi = jours(now.year, now.month, now.day_of_month) - (now.day_of_week + 5) % 7;
            if (id(g_week) != lundi || id(g_week_start) <= 0 || total < id(g_week_start)) {
              // Semaine terminée : sa conso et son lundi sont mémorisés pour la semaine dernière
              if (id(g_week) >= 0 && id(g_week_start) > 0 && total >= id(g_week_start)) {
                id(g_conso_semaine_prec_l) = (total - id(g_week_start)) * 1000.0;
                id(g_semaine_prec_lundi) = id(g_week);
              }
              id(g_week_start) = total; id(g_week) = lundi;
            }
            int mois = now.year * 12 + now.month;
            if (id(g_month) != mois || id(g_month_start) <= 0 || total < id(g_month_start)) {
              // Mois terminé : sa conso et sa clé (année × 12 + mois) sont mémorisés pour le mois dernier
              if (id(g_month) >= 0 && id(g_month_start) > 0 && total >= id(g_month_start)) {
                id(g_conso_mois_prec_l) = (total - id(g_month_start)) * 1000.0;
                id(g_mois_prec_cle) = id(g_month);
              }
              id(g_month_start) = total; id(g_month) = mois;
            }
            // Dernière trame (horodatage UTC : HA l'affiche « il y a 3 minutes »)
            {
              char b[32]; time_t t = (time_t) ts; struct tm tu; gmtime_r(&t, &tu);
              strftime(b, sizeof(b), "%Y-%m-%dT%H:%M:%S+00:00", &tu);
              id(derniere_trame).publish_state(b);
            }
            if (id(g_flow_ts) == 0 || total < id(g_flow_total)) {
              id(g_flow_total) = total; id(g_flow_ts) = ts; return;
            }
            uint32_t dt = ts - id(g_flow_ts);
            if (dt < 120) return;   // trames trop proches : résolution de 1 L
            id(debit_l_h).publish_state((total - id(g_flow_total)) * 1000.0 / (dt / 3600.0));
            id(g_flow_total) = total;
            id(g_flow_ts) = ts;

  - platform: wmbus_meter
    parent_id: mon_compteur
    field: rssi_dbm
    id: eau_rssi
