binary_sensor:
  # Bouton PRG : page suivante ; la nuit, rallume l'écran 60 s (sans changer de page)
  - platform: gpio
    id: bouton
    name: "Bouton de la carte"
    entity_category: diagnostic
    pin:
      number: ${bouton_pin}
      inverted: true
      ignore_strapping_warning: true   # GPIO0 = bouton BOOT/PRG : prévu pour ça
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - lambda: |-
            uint32_t maintenant = millis();
            id(g_pause_ms) = maintenant + 30000;   // laisse 30 s pour lire la page choisie
            if (id(g_ecran_eteint)) {
              id(g_reveil_ms) = maintenant + 60000;
              id(g_ecran_eteint) = false;
              id(oled).turn_on();
            } else {
              id(page_suivante).execute();
            }
            id(oled).update();
  - platform: template
    id: bs_fuite_confirmee
    name: "Fuite confirmée"
    device_class: problem
    lambda: |-
      return id(g_leak_hours) >= (int) id(seuil_fuite_heures).state;
  - platform: template
