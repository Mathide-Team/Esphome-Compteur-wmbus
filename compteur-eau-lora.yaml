# ══════════════════════════════════════════════════════════════════════════════
#  compteur-eau-lora : compteur d'eau Izar / DME (wM-Bus) → Home Assistant
#  Carte Heemol « Lora 32 V4 » : ESP32-S3 + SX1262 + OLED SSD1306 128x64
#
#  secrets.yaml requis :
#    wifi_ssid, wifi_password, fallback_hotspot_ssid, fallback_hotspot_password,
#    ota_password,
#    compteur0 … compteur4   (chaînes entre guillemets, ex. "0x30703283"),
#    nomcompteur1 … nomcompteur4
#
#  Export CSV : l'ESP n'écrit aucun fichier. Il envoie un évènement
#  « esphome.wmbus_trame » à Home Assistant pour chaque compteur entendu (connu
#  ou inconnu) ; HA ajoute la ligne au CSV avec notify.send_message (voir README.md).
# ══════════════════════════════════════════════════════════════════════════════

substitutions:
  # Numéro de TON compteur (secret compteur0, au format "0x30703283", entre guillemets).
  # Sert au récepteur wM-Bus et à l'écran 1 (affiché sans le « 0x »)
  num_compteur: !secret compteur0
  nom_moi: "Mon compteur"   # nom écrit dans le CSV pour ton propre compteur
  # Voisins (secrets compteur1..4 et nomcompteur1..4)
  num_v1: !secret compteur1
  nom_v1: !secret nomcompteur1
  num_v2: !secret compteur2
  nom_v2: !secret nomcompteur2
  num_v3: !secret compteur3
  nom_v3: !secret nomcompteur3
  num_v4: !secret compteur4
  nom_v4: !secret nomcompteur4
  # Police des pictogrammes (Material Design Icons, version figée)
  mdi_url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"

esphome:
  name: compteur-eau-lora
  friendly_name: Compteur Eau LoRa
  # Vext doit être allumé APRÈS le setup() de la sortie GPIO (priorité 800, qui la remet à l'arrêt)
  # et AVANT l'init de l'OLED (priorité 400) : d'où 799. À 800, l'OLED restait éteint (écran noir).
  on_boot:
    priority: 799
    then:
      - output.turn_on: vext_enable
      - lambda: delay(50);   // laisse l'alimentation de l'OLED se stabiliser avant son init

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Les évènements vers HA (export CSV) exigent, côté HA, la case « Autoriser l'appareil à
# effectuer des actions Home Assistant » (Paramètres > Appareils et services > ESPHome > ce
# compteur > Configurer).
api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret fallback_hotspot_ssid
    password: !secret fallback_hotspot_password
captive_portal:

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Chaque heure pile : conso de l'heure écoulée et détection de fuite
      - seconds: 0
        minutes: 0
        then:
          - lambda: |-
              double total = id(g_total);
              if (total <= 0) return;
              if (id(g_hour_start) <= 0) { id(g_hour_start) = total; return; }
              double liters = (total - id(g_hour_start)) * 1000.0;
              id(g_hour_start) = total;
              id(conso_heure_l).publish_state(liters);
              if (liters >= id(seuil_fuite_l).state) {
                id(g_leak_hours)++;
              } else {
                id(g_leak_hours) = 0;
                id(g_night_flag) = false;
              }
              int h = id(ha_time).now().hour;
              if (h == 5 && id(g_leak_hours) >= 3) id(g_night_flag) = true;
              id(heures_continues).publish_state(id(g_leak_hours));
      # Chaque jour à minuit : conso d'hier, puis les « conso aujourd'hui » repartent à 0.
      # Le « 1er index du jour » est mémorisé à la réception de la 1re trame de la nouvelle journée.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              if (!now.is_valid()) return;
              // La veille = 1 h avant minuit (jour de l'année de la journée qui vient de se terminer)
              int veille = ESPTime::from_epoch_local(now.timestamp - 3600).day_of_year;
              if (id(g_day) == veille && id(g_total) > 0 && id(g_day_start) > 0)
                id(conso_hier_l).publish_state((id(g_total) - id(g_day_start)) * 1000.0);
              id(conso_jour_l).update();
              id(v1_conso_jour).update();
              id(v2_conso_jour).update();
              id(v3_conso_jour).update();
              id(v4_conso_jour).update();


globals:
  - id: g_total          # dernier index reçu (m³)
    type: double
    initial_value: '0'
  - id: g_rx_ts          # heure de la dernière trame
    type: uint32_t
    initial_value: '0'
  - id: g_flow_total     # point de référence du calcul de débit
    type: double
    initial_value: '0'
  - id: g_flow_ts
    type: uint32_t
    initial_value: '0'
  - id: g_hour_start     # index au début de l'heure courante
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_day_start      # 1er index reçu dans la journée (référence de la conso du jour)
    type: double
    restore_value: yes
    initial_value: '0'
  - id: g_day            # jour de l'année auquel correspond g_day_start
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: g_leak_hours     # heures consécutives avec conso
    type: int
    restore_value: yes
    initial_value: '0'
  - id: g_night_flag
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: g_page           # page affichée sur l'OLED : 0 = index, 1 = signaux, 2 = alertes
    type: int
    initial_value: '0'

  # ── Voisin 1 ──
  - id: v1_total         # dernier index reçu (m³)
    type: double
    initial_value: '0'
  - id: v1_day_start     # 1er index reçu dans la journée
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v1_day           # jour de l'année auquel correspond v1_day_start
    type: int
    restore_value: yes
    initial_value: '-1'

  # ── Voisin 2 ──
  - id: v2_total
    type: double
    initial_value: '0'
  - id: v2_day_start
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v2_day
    type: int
    restore_value: yes
    initial_value: '-1'

  # ── Voisin 3 ──
  - id: v3_total
    type: double
    initial_value: '0'
  - id: v3_day_start
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v3_day
    type: int
    restore_value: yes
    initial_value: '-1'

  # ── Voisin 4 ──
  - id: v4_total
    type: double
    initial_value: '0'
  - id: v4_day_start
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v4_day
    type: int
    restore_value: yes
    initial_value: '-1'

  # ── Export CSV ──
  - id: g_id_off         # emplacement du n° de compteur dans l'en-tête des trames (4 ou 6), appris tout seul
    type: int
    restore_value: yes
    initial_value: '4'
  - id: g_csv_last       # n° de compteur → instant (s depuis le démarrage) du dernier évènement envoyé
    type: std::map<uint32_t, uint32_t>
  - id: g_ev_nom         # valeurs préparées pour l'évènement envoyé à HA
    type: std::string
    initial_value: '""'
  - id: g_ev_index
    type: std::string
    initial_value: '""'
  - id: g_ev_conso
    type: std::string
    initial_value: '""'

# Vext (GPIO36, actif à l'état bas) : alimente l'OLED et l'étage RF
output:
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    id: vext_enable

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_common, wmbus_radio, wmbus_meter]

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

# Bus I2C de l'OLED intégré (SDA 17 / SCL 18). 400 kHz : rafraîchissement bien plus rapide
i2c:
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz
  scan: false   # le scan se fait avant l'allumage de Vext : il ne verrait pas l'OLED

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14
  busy_pin: GPIO13
  rx_gain: BOOSTED
  rf_switch: true
  has_tcxo: true
  on_frame:
    - then:
        - logger.log:
            format: "RSSI: %ddBm  %s"
            args: [ frame->rssi(), frame->as_hex().c_str() ]

        # ── Export CSV : n° de CHAQUE compteur entendu (connu ou inconnu) → script envoi_trame ──
        - lambda: |-
            if (!id(csv_actif).state) return;

            // 1) Lecture de l'en-tête de la trame : L, C, M, M puis le champ « adresse » (6 octets)
            std::string hex = frame->as_hex();
            uint8_t d[10];
            int n = 0, hi = -1;
            for (char ch : hex) {
              int v = (ch >= '0' && ch <= '9') ? ch - '0' :
                      (ch >= 'a' && ch <= 'f') ? ch - 'a' + 10 :
                      (ch >= 'A' && ch <= 'F') ? ch - 'A' + 10 : -1;
              if (v < 0) continue;
              if (hi < 0) { hi = v; continue; }
              d[n++] = (uint8_t) ((hi << 4) | v);
              hi = -1;
              if (n == 10) break;
            }
            if (n < 10) return;

            // 2) Deux emplacements possibles pour le n° de compteur (octets 4-7 ou 6-9, petit-boutiste)
            uint32_t id_a = (uint32_t) d[4] | ((uint32_t) d[5] << 8) | ((uint32_t) d[6] << 16) | ((uint32_t) d[7] << 24);
            uint32_t id_b = (uint32_t) d[6] | ((uint32_t) d[7] << 8) | ((uint32_t) d[8] << 16) | ((uint32_t) d[9] << 24);

            // 3) Compteur connu ? (le tien = case 0, voisins = cases 1 à 4). Un compteur connu qui
            //    retombe sur l'un des deux emplacements fixe celui à utiliser pour les inconnus.
            const uint32_t connus[5] = {
              (uint32_t) strtoul("${num_compteur}", nullptr, 16),
              (uint32_t) strtoul("${num_v1}", nullptr, 16),
              (uint32_t) strtoul("${num_v2}", nullptr, 16),
              (uint32_t) strtoul("${num_v3}", nullptr, 16),
              (uint32_t) strtoul("${num_v4}", nullptr, 16)
            };
            int slot = -1;
            uint32_t idn = 0;
            for (int i = 0; i < 5 && slot < 0; i++) {
              if (connus[i] == id_a) { slot = i; idn = id_a; id(g_id_off) = 4; }
              else if (connus[i] == id_b) { slot = i; idn = id_b; id(g_id_off) = 6; }
            }
            if (slot < 0) idn = (id(g_id_off) == 6) ? id_b : id_a;

            // 4) Une ligne au maximum par compteur et par intervalle (nombre « Export CSV - intervalle »)
            uint32_t maintenant = millis() / 1000;
            uint32_t pause = (uint32_t) id(csv_intervalle_min).state * 60;
            auto &dernier = id(g_csv_last);
            auto it = dernier.find(idn);
            if (it != dernier.end() && (maintenant - it->second) < pause) return;
            if (it == dernier.end() && dernier.size() >= 64) dernier.clear();   // garde-fou mémoire
            dernier[idn] = maintenant;

            // 5) Envoi (le script attend 2 s que wmbus_meter ait décodé l'index des compteurs connus)
            char buf[9];
            snprintf(buf, sizeof(buf), "%08X", (unsigned int) idn);
            int rssi = (int) frame->rssi();
            ESP_LOGD("csv", "Compteur %s (%s) RSSI %d dBm | en-tete %02X%02X%02X%02X %02X%02X%02X%02X%02X%02X",
                     buf, slot >= 0 ? "connu" : "inconnu", rssi,
                     d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7], d[8], d[9]);
            id(envoi_trame).execute(std::string(buf), rssi, slot);

# Ton compteur (compteur0) puis les quatre voisins. Si un voisin a un autre modèle de compteur,
# change son « type ».
# NB : meter_id doit être un nombre précis (pas de joker) : ESPHome ne peut donc décoder l'index
# QUE des compteurs déclarés ici. Les autres compteurs ne remontent que leur n° et leur RSSI.
wmbus_meter:
  - id: mon_compteur
    meter_id: ${num_compteur}
    type: dme_07
    mode: [T1]
  - id: compteur_v1
    meter_id: ${num_v1}
    type: dme_07
    mode: [T1]
  - id: compteur_v2
    meter_id: ${num_v2}
    type: dme_07
    mode: [T1]
  - id: compteur_v3
    meter_id: ${num_v3}
    type: dme_07
    mode: [T1]
  - id: compteur_v4
    meter_id: ${num_v4}
    type: dme_07
    mode: [T1]

# ───────────────────────── Envoi d'un évènement vers Home Assistant ─────────────────────────
script:
  - id: envoi_trame
    mode: parallel
    parameters:
      p_id: string      # n° de compteur (8 chiffres hexadécimaux)
      p_rssi: int       # RSSI de la trame (dBm)
      p_slot: int       # -1 = inconnu, 0 = mon compteur, 1 à 4 = voisins
    then:
      - delay: 2s       # laisse wmbus_meter décoder la trame et mettre l'index à jour
      - lambda: |-
          auto now = id(ha_time).now();
          // Conso du jour = index courant − 1er index reçu aujourd'hui ; 0 par défaut
          auto conso_l = [&](int jour, double total, double debut) -> double {
            if (!now.is_valid() || jour != now.day_of_year || total <= 0 || debut <= 0) return 0.0;
            return (total - debut) * 1000.0;
          };
          const char *nom = "";
          double total = 0, conso = 0;
          switch (p_slot) {
            case 0: nom = "${nom_moi}"; total = id(g_total);  conso = conso_l(id(g_day),  id(g_total),  id(g_day_start));  break;
            case 1: nom = "${nom_v1}";  total = id(v1_total); conso = conso_l(id(v1_day), id(v1_total), id(v1_day_start)); break;
            case 2: nom = "${nom_v2}";  total = id(v2_total); conso = conso_l(id(v2_day), id(v2_total), id(v2_day_start)); break;
            case 3: nom = "${nom_v3}";  total = id(v3_total); conso = conso_l(id(v3_day), id(v3_total), id(v3_day_start)); break;
            case 4: nom = "${nom_v4}";  total = id(v4_total); conso = conso_l(id(v4_day), id(v4_total), id(v4_day_start)); break;
            default: break;
          }
          id(g_ev_nom) = nom;
          if (p_slot >= 0) {
            char b[16];
            snprintf(b, sizeof(b), "%.3f", total);
            id(g_ev_index) = b;
            snprintf(b, sizeof(b), "%.0f", conso);
            id(g_ev_conso) = b;
          } else {
            // compteur inconnu : ESPHome ne sait pas décoder son index
            id(g_ev_index) = "";
            id(g_ev_conso) = "";
          }
      - homeassistant.event:
          event: esphome.wmbus_trame
          data:
            compteur: !lambda 'return p_id;'
            nom: !lambda 'return id(g_ev_nom);'
            statut: !lambda 'return p_slot >= 0 ? "connu" : "inconnu";'
            rssi_dbm: !lambda 'return std::to_string(p_rssi);'
            index_m3: !lambda 'return id(g_ev_index);'
            conso_jour_l: !lambda 'return id(g_ev_conso);'


sensor:
  - platform: wmbus_meter
    parent_id: mon_compteur
    field: total_m3
    id: eau_total
    name: "Compteur eau - Volume total"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            uint32_t ts = (uint32_t) now.timestamp;
            double total = x;
            id(g_total) = total;
            id(g_rx_ts) = ts;
            // 1er index du jour : 1re trame reçue aujourd'hui (ou index revenu en arrière = compteur remplacé)
            if (id(g_day) != now.day_of_year || id(g_day_start) <= 0 || total < id(g_day_start)) {
              id(g_day_start) = total;
              id(g_day) = now.day_of_year;
            }
            id(conso_jour_l).update();
            if (id(g_flow_ts) == 0 || total < id(g_flow_total)) {
              id(g_flow_total) = total; id(g_flow_ts) = ts; return;
            }
            uint32_t dt = ts - id(g_flow_ts);
            if (dt < 120) return;   // trames trop proches : résolution de 1 L
            id(debit_l_h).publish_state((total - id(g_flow_total)) * 1000.0 / (dt / 3600.0));
            id(g_flow_total) = total;
            id(g_flow_ts) = ts;

  - platform: wmbus_meter
    parent_id: mon_compteur
    field: rssi_dbm
    id: eau_rssi
    name: "Compteur eau - RSSI"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi RSSI"
    update_interval: 30s
    entity_category: diagnostic
  - platform: template
    id: debit_l_h
    name: "Débit estimé"
    unit_of_measurement: "L/h"
    accuracy_decimals: 0
    state_class: measurement
  - platform: template
    id: conso_heure_l
    name: "Conso dernière heure"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
  - platform: template
    id: conso_hier_l
    name: "Conso hier"
    unit_of_measurement: "L"
    accuracy_decimals: 0
  - platform: template
    id: heures_continues
    name: "Heures de conso continue"
    unit_of_measurement: "h"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: conso_jour_l
    name: "Conso aujourd'hui"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      // Conso du jour = index courant − 1er index reçu aujourd'hui ; 0 par défaut
      // (au démarrage, après minuit, ou tant qu'aucune trame du jour n'est arrivée)
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(g_day) != now.day_of_year || id(g_total) <= 0 || id(g_day_start) <= 0)
        return 0.0f;
      return (float) ((id(g_total) - id(g_day_start)) * 1000.0);

  # ── Voisin 1 : index + RSSI + conso du jour (visibles dans Home Assistant) ──
  - platform: wmbus_meter
    parent_id: compteur_v1
    field: total_m3
    id: v1_index
    name: "${nom_v1} - Index"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            double total = x;
            // 1er index du jour : 1re trame reçue aujourd'hui
            if (id(v1_day) != now.day_of_year || id(v1_day_start) <= 0 || total < id(v1_day_start)) {
              id(v1_day_start) = total;
              id(v1_day) = now.day_of_year;
            }
            id(v1_total) = total;
            id(v1_conso_jour).update();
  - platform: wmbus_meter
    parent_id: compteur_v1
    field: rssi_dbm
    id: v1_rssi
    name: "${nom_v1} - RSSI"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: v1_conso_jour
    name: "${nom_v1} - Conso aujourd'hui"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(v1_day) != now.day_of_year || id(v1_total) <= 0 || id(v1_day_start) <= 0)
        return 0.0f;
      return (float) ((id(v1_total) - id(v1_day_start)) * 1000.0);

  # ── Voisin 2 : index + RSSI + conso du jour (visibles dans Home Assistant) ──
  - platform: wmbus_meter
    parent_id: compteur_v2
    field: total_m3
    id: v2_index
    name: "${nom_v2} - Index"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            double total = x;
            if (id(v2_day) != now.day_of_year || id(v2_day_start) <= 0 || total < id(v2_day_start)) {
              id(v2_day_start) = total;
              id(v2_day) = now.day_of_year;
            }
            id(v2_total) = total;
            id(v2_conso_jour).update();
  - platform: wmbus_meter
    parent_id: compteur_v2
    field: rssi_dbm
    id: v2_rssi
    name: "${nom_v2} - RSSI"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: v2_conso_jour
    name: "${nom_v2} - Conso aujourd'hui"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(v2_day) != now.day_of_year || id(v2_total) <= 0 || id(v2_day_start) <= 0)
        return 0.0f;
      return (float) ((id(v2_total) - id(v2_day_start)) * 1000.0);

  # ── Voisin 3 : index + RSSI + conso du jour (visibles dans Home Assistant) ──
  - platform: wmbus_meter
    parent_id: compteur_v3
    field: total_m3
    id: v3_index
    name: "${nom_v3} - Index"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            double total = x;
            if (id(v3_day) != now.day_of_year || id(v3_day_start) <= 0 || total < id(v3_day_start)) {
              id(v3_day_start) = total;
              id(v3_day) = now.day_of_year;
            }
            id(v3_total) = total;
            id(v3_conso_jour).update();
  - platform: wmbus_meter
    parent_id: compteur_v3
    field: rssi_dbm
    id: v3_rssi
    name: "${nom_v3} - RSSI"
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: v3_conso_jour
    name: "${nom_v3} - Conso aujourd'hui"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(v3_day) != now.day_of_year || id(v3_total) <= 0 || id(v3_day_start) <= 0)
        return 0.0f;
      return (float) ((id(v3_total) - id(v3_day_start)) * 1000.0);

  # ── Voisin 4 : index + RSSI + conso du jour (visibles dans Home Assistant) ──
