            if (id(v4_day) != now.day_of_year || id(v4_day_start) <= 0 || total < id(v4_day_start)) {
              id(v4_day_start) = total;
              id(v4_day) = now.day_of_year;
            }
            id(v4_total) = total;
            id(v4_conso_jour).update();
  - platform: wmbus_meter
