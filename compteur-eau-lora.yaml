binary_sensor:
  - platform: template
    id: bs_fuite_confirmee
    name: "Fuite confirmée"
    device_class: problem
    lambda: |-
      return id(g_leak_hours) >= (int) id(seuil_fuite_heures).state;
  - platform: template
    id: bs_fuite_nuit
    name: "Fuite suspectée (nuit)"
    device_class: problem
    lambda: |-
      return id(g_night_flag);
  - platform: template
    id: bs_debit_anormal
    name: "Débit anormal"
    device_class: problem
    lambda: |-
      if (!id(debit_l_h).has_state()) return false;
      return id(debit_l_h).state > id(seuil_debit_l_h).state;
    filters:
      - delayed_on: 10min
  - platform: template
    id: bs_conso_jour
    name: "Conso journalière anormale"
    device_class: problem
    lambda: |-
      if (!id(conso_jour_l).has_state()) return false;
      return id(conso_jour_l).state > id(seuil_jour_l).state;
  - platform: template
    id: bs_absence
    name: "Conso pendant absence"
    device_class: problem
    lambda: |-
      if (!id(mode_absence).state || !id(conso_heure_l).has_state()) return false;
      return id(conso_heure_l).state >= 1;
  - platform: template
    id: bs_silencieux
    name: "Compteur silencieux"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(g_rx_ts) == 0) return false;
      return ((uint32_t) now.timestamp - id(g_rx_ts)) > 6 * 3600;

# ───────────────────────── Écran OLED (SSD1306 128x64 de la carte) ─────────────────────────

font:
  # Texte
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: f_big            # index du compteur
    size: 22
    glyphs: &glyphes_texte '!"#%()+,-./0123456789:?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°³éèêàâùûôîçÉ '
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: f_mid            # conso du jour, dBm
    size: 18
    glyphs: *glyphes_texte
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: f_hdr            # titre de l'écran alertes
    size: 14
    glyphs: *glyphes_texte
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: f_small          # n° de compteur, unités, libellés d'alertes
    size: 12
    glyphs: *glyphes_texte

  # Pictogrammes (Material Design Icons)
  - file: ${mdi_url}
    id: f_icon_l
    size: 26
    glyphs:
      - "\U000F058C"     # water (goutte)
      - "\U000F05A9"     # wifi
      - "\U000F043B"     # radio-tower (compteur Izar / DME)
  - file: ${mdi_url}
    id: f_icon_m
    size: 18
    glyphs:
      - "\U000F00F6"     # calendar-today (conso du jour)
      - "\U000F0026"     # alert (titre alertes)
  - file: ${mdi_url}
    id: f_icon_s
    size: 14
    glyphs:
      - "\U000F0423"     # pound (n° de compteur)
      - "\U000F0889"     # pipe-leak (fuite confirmée)
      - "\U000F0594"     # weather-night (fuite de nuit)
      - "\U000F04C5"     # speedometer (débit anormal)
      - "\U000F0A31"     # calendar-alert (conso journalière)
      - "\U000F087B"     # home-alert (conso pendant absence)
      - "\U000F0783"     # signal-off (compteur silencieux)

# Rotation des pages toutes les 5 s ; la page « alertes » est sautée s'il n'y a aucune alerte
interval:
  - interval: 5s
    then:
      - lambda: |-
          bool alerte = id(bs_fuite_confirmee).state || id(bs_fuite_nuit).state ||
                        id(bs_debit_anormal).state || id(bs_conso_jour).state ||
                        id(bs_absence).state || id(bs_silencieux).state;
          int suivante = (id(g_page) + 1) % 3;
          if (suivante == 2 && !alerte) suivante = 0;
          id(g_page) = suivante;
          id(oled).update();

display:
  - platform: ssd1306_i2c
    id: oled
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    update_interval: 2s
    lambda: |-
      // ── Alertes actives ──
      struct Alerte { const char *icone; const char *libelle; bool active; };
      Alerte alertes[] = {
        {"\U000F0889", "Fuite confirmée",   id(bs_fuite_confirmee).state},
        {"\U000F0594", "Fuite de nuit",     id(bs_fuite_nuit).state},
        {"\U000F04C5", "Débit anormal",     id(bs_debit_anormal).state},
        {"\U000F0A31", "Conso jour élevée", id(bs_conso_jour).state},
        {"\U000F087B", "Conso en absence",  id(bs_absence).state},
        {"\U000F0783", "Compteur muet",     id(bs_silencieux).state},
      };
      int nb_alertes = 0;
      for (auto &a : alertes) if (a.active) nb_alertes++;

      int page = id(g_page);
      if (page == 2 && nb_alertes == 0) page = 0;

      // ── Barres de signal (4 niveaux) : pleines = niveau atteint, contour = vide ──
      auto barres = [&](int x, int yb, int niveau) {
        for (int i = 0; i < 4; i++) {
          int h = 7 + i * 5;
          int xx = x + i * 7;
          if (i < niveau) it.filled_rectangle(xx, yb - h + 1, 5, h);
          else it.rectangle(xx, yb - h + 1, 5, h);
        }
      };
      // Seuils (dBm) : à ajuster selon vos goûts
      auto niv_wifi = [](float d) { return std::isnan(d) ? 0 : d >= -55 ? 4 : d >= -67 ? 3 : d >= -75 ? 2 : d >= -85 ? 1 : 0; };
      auto niv_rf   = [](float d) { return std::isnan(d) ? 0 : d >= -60 ? 4 : d >= -75 ? 3 : d >= -90 ? 2 : d >= -100 ? 1 : 0; };

      if (page == 0) {
        // ═══ Écran 1 : index / conso du jour / n° de compteur ═══
        it.print(0, 13, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F058C");
        auto f_index = id(g_total) >= 1000 ? id(f_mid) : id(f_big);   // 4 chiffres avant la virgule : police réduite
        if (id(g_total) > 0)
          it.printf(26, 23, f_index, TextAlign::BASELINE_LEFT, "%.3f", id(g_total));
        else
          it.print(26, 23, f_index, TextAlign::BASELINE_LEFT, "---.---");
        it.print(127, 23, id(f_small), TextAlign::BASELINE_RIGHT, "m³");

        it.horizontal_line(0, 28, 128);

        // Conso du jour = index courant − 1er index reçu aujourd'hui ; 0 L par défaut.
        // Calculée ici à partir des variables internes (pas besoin d'attendre le capteur).
        float conso_l = 0;
        {
          auto maintenant = id(ha_time).now();
          if (maintenant.is_valid() && id(g_day) == maintenant.day_of_year && id(g_total) > 0 && id(g_day_start) > 0)
            conso_l = (id(g_total) - id(g_day_start)) * 1000.0;
        }
        it.print(0, 40, id(f_icon_m), TextAlign::CENTER_LEFT, "\U000F00F6");
        it.printf(26, 46, id(f_mid), TextAlign::BASELINE_LEFT, "%.0f L", conso_l);

        it.print(0, 57, id(f_icon_s), TextAlign::CENTER_LEFT, "\U000F0423");
        // + 2 : saute le préfixe « 0x » du secret
        it.print(16, 62, id(f_small), TextAlign::BASELINE_LEFT, "${num_compteur}" + 2);

      } else if (page == 1) {
        // ═══ Écran 2 : puissance des signaux WiFi et Izar/DME ═══
        float rssi_wifi = id(wifi_rssi).state;
        float rssi_rf = id(eau_rssi).state;

        it.print(0, 16, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F05A9");
        barres(34, 28, niv_wifi(rssi_wifi));
        if (!std::isnan(rssi_wifi)) {
          it.printf(99, 24, id(f_mid), TextAlign::BASELINE_RIGHT, "%.0f", rssi_wifi);
          it.print(102, 24, id(f_small), TextAlign::BASELINE_LEFT, "dBm");
        } else {
          it.print(99, 24, id(f_mid), TextAlign::BASELINE_RIGHT, "--");
        }

        it.horizontal_line(0, 32, 128);

        it.print(0, 48, id(f_icon_l), TextAlign::CENTER_LEFT, "\U000F043B");
        barres(34, 60, niv_rf(rssi_rf));
        if (!std::isnan(rssi_rf)) {
          it.printf(99, 56, id(f_mid), TextAlign::BASELINE_RIGHT, "%.0f", rssi_rf);
          it.print(102, 56, id(f_small), TextAlign::BASELINE_LEFT, "dBm");
        } else {
          it.print(99, 56, id(f_mid), TextAlign::BASELINE_RIGHT, "--");
        }

      } else {
        // ═══ Écran 3 : alertes actives ═══
        it.print(0, 8, id(f_icon_m), TextAlign::CENTER_LEFT, "\U000F0026");
        it.print(24, 13, id(f_hdr), TextAlign::BASELINE_LEFT, "ALERTE");
        it.printf(127, 13, id(f_hdr), TextAlign::BASELINE_RIGHT, "%d", nb_alertes);

        it.horizontal_line(0, 16, 128);

        int max_lignes = nb_alertes > 4 ? 3 : 4;   // 4e ligne = « +N autres » si trop d'alertes
        int ligne = 0;
        for (auto &a : alertes) {
          if (!a.active || ligne >= max_lignes) continue;
          int y = 23 + ligne * 11;
          it.print(0, y, id(f_icon_s), TextAlign::CENTER_LEFT, a.icone);
          it.print(20, y, id(f_small), TextAlign::CENTER_LEFT, a.libelle);
          ligne++;
        }
        if (nb_alertes > ligne)
          it.printf(20, 23 + ligne * 11, id(f_small), TextAlign::CENTER_LEFT, "+%d autres", nb_alertes - ligne);
      }
