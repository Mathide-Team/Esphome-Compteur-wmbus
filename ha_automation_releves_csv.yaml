# Home Assistant : ajoute une ligne au CSV des relevés à chaque évènement « esphome.wmbus_trame »
# envoyé par l'ESP (compteurs connus ET inconnus, au plus 1 par compteur et par
# « Export CSV - intervalle », 15 min par défaut).
#
# Rien à adapter sauf l'entité notify (créée par l'intégration File, voir docs/export-csv-home-assistant.md).
# Toutes les valeurs viennent de l'évènement : pas de table de compteurs à tenir à jour.
#
# Installation (interface, sans toucher à configuration.yaml ni à automations.yaml) :
#   Paramètres > Automatisations et scènes > Créer une automatisation > Créer une nouvelle
#   automatisation > ⋮ > Modifier en YAML, remplacer tout le contenu par ce fichier, Enregistrer.
# (Pour automations.yaml : ajouter « - » devant « alias » et indenter le reste de 2 espaces.)
#
# Colonnes : timestamp;compteur;nom;statut;rssi_dbm;index_m3;conso_jour_l  (séparateur « ; », décimale « , »)
alias: "Compteurs eau - ligne CSV"
id: compteurs_eau_csv
description: "Ajoute une ligne au CSV des relevés (compteurs connus et inconnus)"
mode: queued
max: 50
triggers:
  - trigger: event
    event_type: esphome.wmbus_trame
actions:
  - variables:
      d: "{{ trigger.event.data }}"
      ligne: >-
        {{ as_local(trigger.event.time_fired).strftime('%Y-%m-%d %H:%M:%S') }};{{ d.compteur }};{{ d.nom }};{{ d.statut }};{{ d.rssi_dbm }};{{ d.index_m3 | replace('.', ',') }};{{ d.conso_jour_l }}
  - action: notify.send_message
    target:
      entity_id: notify.releves_compteurs   # À ADAPTER : l'entité créée par l'intégration File
    data:
      message: "{{ ligne }}"

  # ── Extension : prévenir le voisin concerné (décommenter) ─────────────────────
  # Même ligne, renvoyée sur un topic MQTT propre à chaque compteur. Nécessite l'intégration MQTT
  # et un broker où chaque voisin n'a le droit de lire QUE son topic.
  # - if:
  #     - condition: template
  #       value_template: "{{ d.statut == 'connu' }}"
  #   then:
  #     - action: mqtt.publish
  #       data:
  #         topic: "compteurs_eau/{{ d.compteur }}/releve"
  #         payload: "{{ ligne }}"
  #         retain: true
  # Autres notify possibles : notify.mobile_app_<téléphone>, Telegram, e-mail, ntfy
  # (intégration ntfy de HA, ou l'ESP en direct : dépôt Esphome-Compteur-wmbus-ntfy).
