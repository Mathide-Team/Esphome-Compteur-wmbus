# Tableau de bord Home Assistant « Compteur d'eau »
#
# Installation : Paramètres > Tableaux de bord > Ajouter un tableau de bord > Nouveau tableau de bord
# à partir de zéro (titre « Compteur d'eau »). Ouvre-le, puis crayon > ⋮ > Éditeur de configuration
# brute : remplace tout le contenu par ce fichier et enregistre.
#
# Les identifiants d'entités supposent l'appareil nommé « compteur-eau-lora » (voir le YAML ESPHome).
# Dans les graphiques « statistics-graph », les capteurs cumulés (state_class: total_increasing,
# comme l'index) n'ont que les statistiques state / sum / change, et les capteurs « measurement »
# n'ont que mean / min / max. Un type de statistique absent donne un graphique vide.
#
# Avec des voisins : scripts/generer_tableau_de_bord.py ajoute la vue « Voisins », règle les
# jauges sur les seuils d'alerte et les boutons ntfy si le paquet est installé (voir README).
title: Compteur d'eau
views:
  - title: Eau
    path: eau
    icon: mdi:water
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: En direct
            icon: mdi:gauge
          - type: gauge
            entity: sensor.compteur_eau_lora_debit_estime
            name: Débit estimé
            min: 0
            max: 1500
            needle: true
            segments:
              - from: 0
                color: '#43a047'
              - from: 300
                color: '#fb8c00'
              - from: 1000
                color: '#e53935'
          - type: gauge
            entity: sensor.compteur_eau_lora_conso_aujourd_hui
            name: Conso aujourd'hui
            min: 0
            max: 1000
            needle: true
            segments:
              - from: 0
                color: '#43a047'
              - from: 500
                color: '#fb8c00'
              - from: 800
                color: '#e53935'
          - type: tile
            entity: sensor.compteur_eau_lora_compteur_eau_volume_total
            name: Index du compteur
            icon: mdi:counter
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_conso_derniere_heure
            name: Dernière heure
            icon: mdi:clock-outline
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_conso_hier
            name: Hier
            icon: mdi:calendar-arrow-left
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_heures_de_conso_continue
            name: Heures continues
            icon: mdi:timer-sand
            vertical: true
      - type: grid
        cards:
          - type: heading
            heading: Coûts et périodes
            icon: mdi:currency-eur
          - type: tile
            entity: sensor.compteur_eau_lora_cout_aujourd_hui
            name: Coût aujourd'hui
            icon: mdi:cash
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_cout_mois
            name: Coût du mois
            icon: mdi:cash-multiple
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_conso_semaine
            name: Cette semaine
            icon: mdi:calendar-week
            vertical: true
          - type: tile
            entity: sensor.compteur_eau_lora_conso_mois
            name: Ce mois-ci
            icon: mdi:calendar-month
            vertical: true
          # Conso par semaine et par mois = variation de l'index sur chaque période (« change »)
          - type: statistics-graph
            title: Conso par semaine (12 semaines)
            chart_type: bar
            period: week
            days_to_show: 84
            stat_types:
              - change
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
          - type: statistics-graph
            title: Conso par mois (12 mois)
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
      - type: grid
        cards:
          - type: heading
            heading: Alertes
            icon: mdi:alert-circle-outline
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_fuite_confirmee
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_fuite_confirmee
              name: Fuite confirmée
              icon: mdi:pipe-leak
              color: red
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_fuite_suspectee_nuit
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_fuite_suspectee_nuit
              name: Fuite suspectée (nuit)
              icon: mdi:weather-night
              color: orange
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_debit_anormal
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_debit_anormal
              name: Débit anormal
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_conso_journaliere_anormale
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_conso_journaliere_anormale
              name: Conso journalière anormale
              icon: mdi:calendar-alert
              color: orange
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_conso_pendant_absence
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_conso_pendant_absence
              name: Conso pendant absence
              icon: mdi:home-alert
              color: red
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.compteur_eau_lora_compteur_silencieux
                state: 'on'
            card:
              type: tile
              entity: binary_sensor.compteur_eau_lora_compteur_silencieux
              name: Compteur silencieux
              icon: mdi:radio-tower-off
              color: orange
          - type: conditional
            conditions:
              - condition: and
                conditions:
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_fuite_confirmee
                    state: 'off'
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_fuite_suspectee_nuit
                    state: 'off'
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_debit_anormal
                    state: 'off'
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_conso_journaliere_anormale
                    state: 'off'
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_conso_pendant_absence
                    state: 'off'
                  - condition: state
                    entity: binary_sensor.compteur_eau_lora_compteur_silencieux
                    state: 'off'
            card:
              type: markdown
              content: ✅ **Aucune anomalie détectée**
          # Journal : début et fin de chaque alerte sur 7 jours
          - type: logbook
            title: Historique des alertes (7 jours)
            hours_to_show: 168
            target:
              entity_id:
                - binary_sensor.compteur_eau_lora_fuite_confirmee
                - binary_sensor.compteur_eau_lora_fuite_suspectee_nuit
                - binary_sensor.compteur_eau_lora_debit_anormal
                - binary_sensor.compteur_eau_lora_conso_journaliere_anormale
                - binary_sensor.compteur_eau_lora_conso_pendant_absence
                - binary_sensor.compteur_eau_lora_compteur_silencieux
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Historique
            icon: mdi:chart-line
          - type: history-graph
            title: Conso aujourd'hui
            hours_to_show: 24
            entities:
              - entity: sensor.compteur_eau_lora_conso_aujourd_hui
          - type: history-graph
            title: Débit (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.compteur_eau_lora_debit_estime
          # Hier et aujourd'hui côte à côte : conso par heure sur 48 h
          - type: statistics-graph
            title: Conso horaire (48 h, hier et aujourd'hui)
            chart_type: bar
            period: hour
            days_to_show: 2
            stat_types:
              - change
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
          # Conso par heure = variation de l'index sur chaque heure (« change »).
          # L'ancienne version demandait « state » sur un capteur « measurement » : graphique vide.
          - type: statistics-graph
            title: Conso horaire (7 jours)
            chart_type: bar
            period: hour
            days_to_show: 7
            stat_types:
              - change
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
          # Conso par jour = variation de l'index sur chaque journée
          - type: statistics-graph
            title: Conso journalière (30 jours)
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
          # Index : « state » (un capteur total_increasing n'a pas de statistique « max » : graphique vide)
          - type: statistics-graph
            title: Volume total (30 jours)
            chart_type: line
            period: day
            days_to_show: 30
            stat_types:
              - state
            entities:
              - sensor.compteur_eau_lora_compteur_eau_volume_total
      - type: grid
        cards:
          - type: heading
            heading: Actions
            icon: mdi:gesture-tap-button
          - type: tile
            entity: switch.compteur_eau_lora_mode_absence
            name: Mode absence
            icon: mdi:airplane
            features:
              - type: toggle
          - type: entities
            title: Écran de la carte
            show_header_toggle: false
            entities:
              - entity: switch.compteur_eau_lora_ecran_extinction_nocturne
                name: Extinction nocturne
              - entity: number.compteur_eau_lora_ecran_extinction_a
                name: Éteint à
              - entity: number.compteur_eau_lora_ecran_rallumage_a
                name: Rallumé à
      - type: grid
        cards:
          - type: heading
            heading: Réglages
            icon: mdi:cog
          - type: entities
            title: Prix de l'eau
            show_header_toggle: false
            entities:
              - entity: number.compteur_eau_lora_prix_de_l_eau_au_m3
                name: Prix au m³ (sans abonnement)
          - type: entities
            title: Seuils de détection
            show_header_toggle: false
            entities:
              - entity: number.compteur_eau_lora_fuite_conso_min_par_heure
                name: Fuite - conso min par heure
              - entity: number.compteur_eau_lora_fuite_heures_consecutives
                name: Fuite - heures consécutives
              - entity: number.compteur_eau_lora_seuil_debit_anormal
                name: Seuil débit anormal
              - entity: number.compteur_eau_lora_seuil_conso_journaliere
                name: Seuil conso journalière
              - entity: number.compteur_eau_lora_compteur_silencieux_apres
                name: Compteur silencieux après
          - type: entities
            title: Export CSV
            show_header_toggle: false
            entities:
              - entity: switch.compteur_eau_lora_export_csv_actif
                name: Export actif
              - entity: number.compteur_eau_lora_export_csv_intervalle
                name: Intervalle
      - type: grid
        cards:
          - type: heading
            heading: Diagnostic
            icon: mdi:radio-tower
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.compteur_eau_lora_compteur_eau_statut
                name: Statut du compteur
              - entity: sensor.compteur_eau_lora_compteur_eau_derniere_trame
                name: Dernière trame reçue
              - entity: sensor.compteur_eau_lora_compteur_eau_rssi
                name: RSSI radio (compteur)
              - entity: sensor.compteur_eau_lora_wifi_rssi
                name: RSSI WiFi (ESP32)
              - entity: binary_sensor.compteur_eau_lora_compteur_silencieux
                name: Compteur silencieux
      - type: grid
        cards:
          - type: heading
            heading: Signal
            icon: mdi:signal
          - type: history-graph
            title: Signal radio et WiFi (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.compteur_eau_lora_compteur_eau_rssi
                name: Radio (compteur)
              - entity: sensor.compteur_eau_lora_wifi_rssi
                name: WiFi
