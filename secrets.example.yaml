# Copier ce fichier en « secrets.yaml » et remplacer les valeurs.
# Ne JAMAIS publier secrets.yaml (il est dans le .gitignore proposé par le README).

wifi_ssid: "MonWifi"
wifi_password: "mot-de-passe-wifi"
fallback_hotspot_ssid: "Compteur-Eau-Fallback"
fallback_hotspot_password: "au-moins-8-caracteres"
ota_password: "mot-de-passe-ota"     # mot de passe OTA (mise à jour sans fil)

# Numéros de compteur : ENTRE GUILLEMETS, chiffres tels qu'imprimés sur le compteur, avec « 0x ».
compteur0: "0x12345678"          # TON compteur (obligatoire)

# ── Type de compteur (facultatif, dme_07 par défaut) ──
# dme_07 : Grand Besançon (DME) | izar : Grand Belfort (Izar) | auto : choisi à chaque trame.
# Dans le doute, regarde les journaux : chaque trame indique « DME » ou « Izar » (README, « Izar / DME »).
# type_compteur: "izar"

# ── Clé AES (facultatif) : seulement si l'opérateur chiffre les trames ──
# 32 caractères hexadécimaux. Absente ou "" = trames en clair (cas de Besançon et Belfort aujourd'hui).
# aes: "00112233445566778899AABBCCDDEEFF"     # ton compteur ; aesv1, aesv2… pour les voisins

# ── Voisins (0 à 10) : un voisin existe dès que son « compteurN » est présent ──
# Rien à modifier dans compteur-eau-lora.yaml. Supprimer compteurN retire le voisin.
#   nomcompteurN   nom affiché dans Home Assistant (facultatif : « Voisin N »)
#   aesvN          sa clé AES (facultatif : en clair)
#   typecompteurN  son type, s'il diffère de type_compteur (facultatif)
# Garde le même N pour un voisin : ses entités et son historique en dépendent.
compteur1: "0x23456789"          # voisin 1
nomcompteur1: "Dupont"
compteur2: "0x34567890"          # voisin 2
nomcompteur2: "Martin"
compteur3: "0x45678901"          # voisin 3
nomcompteur3: "Durand"
compteur4: "0x56789012"          # voisin 4
nomcompteur4: "Petit"
# compteur5: "0x67890123"
# nomcompteur5: "Moreau"
# typecompteur5: "izar"
# … jusqu'à compteur10 / nomcompteur10
