compteur1: "0x23456789"          # voisin 1
nomcompteur1: "Dupont"           # nom affiché dans Home Assistant
compteur2: "0x34567890"          # voisin 2
nomcompteur2: "Martin"
compteur3: "0x45678901"          # voisin 3
nomcompteur3: "Durand"
compteur4: "0x56789012"          # voisin 4
nomcompteur4: "Petit"
