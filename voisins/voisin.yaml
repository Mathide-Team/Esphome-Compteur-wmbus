# ══════════════════════════════════════════════════════════════════════════════
#  voisins/voisin.yaml : modèle d'UN compteur voisin (paquet ESPHome avec variables)
#
#  Inclus automatiquement par voisins/voisins.yaml pour chaque « compteurN » de secrets.yaml.
#  Inclusion manuelle toujours possible (à la place de voisins/voisins.yaml, pas en plus) :
#
#    packages:
#      voisin1: !include { file: voisins/voisin.yaml, vars: { i: 1, num: !secret compteur1, nom: !secret nomcompteur1 } }
#
#  Variables :
#    i     numéro du voisin, de 1 à 10, unique (sert aux identifiants : v1_total, compteur_v1…)
#    num   numéro du compteur : "0x12345678" (chiffres imprimés sur le compteur, avec « 0x »)
#          ou nombre déjà converti (voisins/voisins.yaml)
#    nom   nom affiché dans Home Assistant (« Dupont - Index »…)
#    type  facultatif : pilote wmbus_meter (dme_07 par défaut, izar pour un compteur Izar…)
#
#  Ce fichier ne contient aucun secret : il peut aussi être chargé directement depuis GitHub
#  (voir README, « Voisins »).
# ══════════════════════════════════════════════════════════════════════════════

substitutions:
  type: dme_07          # valeur par défaut, remplacée par vars: { type: … }

# Inscription du voisin dans les tables de compteur-eau-lora.yaml (export CSV, compteurs connus).
# Priorité 600 : après la création des globals, avant la réception des premières trames.
esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            uint32_t numero = (uint32_t) ${num};   // littéral C++ : 0x12345678 ou nombre
            id(g_voisins)[numero] = ${i};
            id(g_v_infos)[${i}] = [](std::string &nom, double &total, double &conso) {
              nom = "${nom}";
              total = id(v${i}_total);
              auto now = id(ha_time).now();
              conso = (!now.is_valid() || id(v${i}_day) != now.day_of_year || id(v${i}_total) <= 0 || id(v${i}_day_start) <= 0)
                        ? 0.0 : (id(v${i}_total) - id(v${i}_day_start)) * 1000.0;
            };
            ESP_LOGI("voisin", "Voisin ${i} (${nom}) : compteur %08X", (unsigned int) numero);

globals:
  - id: v${i}_total         # dernier index reçu (m³)
    type: double
    initial_value: '0'
  - id: v${i}_day_start     # 1er index reçu dans la journée
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v${i}_day           # jour de l'année auquel correspond v${i}_day_start
    type: int
    restore_value: yes
    initial_value: '-1'
  # Alertes du voisin : mêmes règles et mêmes seuils que pour ton compteur
  - id: v${i}_rx_ts         # heure de la dernière trame (compteur silencieux)
    type: uint32_t
    initial_value: '0'
  - id: v${i}_flow_total    # point de référence du calcul de débit
    type: double
    initial_value: '0'
  - id: v${i}_flow_ts
    type: uint32_t
    initial_value: '0'
  - id: v${i}_hour_start    # index au début de l'heure courante
    type: double
    restore_value: yes
    initial_value: '0'
  - id: v${i}_leak_hours    # heures consécutives avec conso
    type: int
    restore_value: yes
    initial_value: '0'
  - id: v${i}_night_flag    # fuite suspectée la nuit (à 5 h, au moins 3 h de conso d'affilée)
    type: bool
    restore_value: yes
    initial_value: 'false'

wmbus_meter:
  - id: compteur_v${i}
    meter_id: ${num}
    type: ${type}
    mode: [T1]

# Minuit : la conso du jour repart à 0 tout de suite (sans attendre la mise à jour de 60 s)
time:
  - id: !extend ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - component.update: v${i}_conso_jour
      # Chaque heure pile : conso de l'heure écoulée et détection de fuite (comme ton compteur)
      - seconds: 0
        minutes: 0
        then:
          - lambda: |-
              double total = id(v${i}_total);
              if (total <= 0) return;
              if (id(v${i}_hour_start) <= 0 || total < id(v${i}_hour_start)) { id(v${i}_hour_start) = total; return; }
              double litres = (total - id(v${i}_hour_start)) * 1000.0;
              id(v${i}_hour_start) = total;
              if (litres >= id(seuil_fuite_l).state) {
                id(v${i}_leak_hours)++;
              } else {
                id(v${i}_leak_hours) = 0;
                id(v${i}_night_flag) = false;
              }
              if (id(ha_time).now().hour == 5 && id(v${i}_leak_hours) >= 3) id(v${i}_night_flag) = true;

sensor:
  - platform: wmbus_meter
    parent_id: compteur_v${i}
    field: total_m3
    id: v${i}_index
    name: "${nom} - Index"
    device_class: water
    state_class: total_increasing
    unit_of_measurement: "m³"   # écrit en dur : le composant publie « m3 », refusé par le tableau de bord Énergie
    accuracy_decimals: 3
    on_value:
      then:
        - lambda: |-
            double total = x;
            id(v${i}_total) = total;   // mémorisé même si l'heure n'est pas encore connue
            auto now = id(ha_time).now();
            if (!now.is_valid()) return;
            // 1er index du jour : 1re trame reçue aujourd'hui (ou index revenu en arrière = compteur remplacé)
            if (id(v${i}_day) != now.day_of_year || id(v${i}_day_start) <= 0 || total < id(v${i}_day_start)) {
              id(v${i}_day_start) = total;
              id(v${i}_day) = now.day_of_year;
            }
            id(v${i}_conso_jour).update();
            uint32_t ts = (uint32_t) now.timestamp;
            id(v${i}_rx_ts) = ts;
            // Débit entre deux trames séparées d'au moins 120 s (résolution de 1 L)
            if (id(v${i}_flow_ts) == 0 || total < id(v${i}_flow_total)) {
              id(v${i}_flow_total) = total; id(v${i}_flow_ts) = ts;
            } else if (ts - id(v${i}_flow_ts) >= 120) {
              id(v${i}_debit).publish_state((total - id(v${i}_flow_total)) * 1000.0 / ((ts - id(v${i}_flow_ts)) / 3600.0));
              id(v${i}_flow_total) = total; id(v${i}_flow_ts) = ts;
            }
            // Dernière trame (horodatage UTC : HA l'affiche « il y a 3 minutes »)
            char b[32]; time_t t = (time_t) ts; struct tm tu; gmtime_r(&t, &tu);
            strftime(b, sizeof(b), "%Y-%m-%dT%H:%M:%S+00:00", &tu);
            id(v${i}_derniere_trame).publish_state(b);
  - platform: wmbus_meter
    parent_id: compteur_v${i}
    field: rssi_dbm
    id: v${i}_rssi
    name: "${nom} - RSSI"
    device_class: signal_strength
    unit_of_measurement: "dBm"  # le composant publie « dbm »
    state_class: measurement
    entity_category: diagnostic
  - platform: template
    id: v${i}_debit
    name: "${nom} - Débit estimé"
    device_class: volume_flow_rate  # attendu par le champ « débit d'eau » du tableau de bord Énergie (#46)
    unit_of_measurement: "L/h"
    accuracy_decimals: 0
    state_class: measurement
  - platform: template
    id: v${i}_conso_jour
    name: "${nom} - Conso aujourd'hui"
    unit_of_measurement: "L"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(v${i}_day) != now.day_of_year || id(v${i}_total) <= 0 || id(v${i}_day_start) <= 0)
        return 0.0f;
      return (float) ((id(v${i}_total) - id(v${i}_day_start)) * 1000.0);

text_sensor:
  - platform: template
    id: v${i}_derniere_trame
    name: "${nom} - Dernière trame"
    device_class: timestamp
    entity_category: diagnostic

# Alertes du voisin (mêmes seuils que ton compteur : réglages « Fuite - … », « Seuil … »).
# Le paquet ntfy peut les envoyer sur le sujet du voisin.
binary_sensor:
  - platform: template
    id: v${i}_fuite_confirmee
    name: "${nom} - Fuite confirmée"
    device_class: problem
    lambda: 'return id(v${i}_leak_hours) >= (int) id(seuil_fuite_heures).state;'
  - platform: template
    id: v${i}_fuite_nuit
    name: "${nom} - Fuite suspectée (nuit)"
    device_class: problem
    lambda: 'return id(v${i}_night_flag);'
  - platform: template
    id: v${i}_debit_anormal
    name: "${nom} - Débit anormal"
    device_class: problem
    lambda: |-
      if (!id(v${i}_debit).has_state()) return false;
      return id(v${i}_debit).state > id(seuil_debit_l_h).state;
    filters:
      - delayed_on: 10min
  - platform: template
    id: v${i}_conso_anormale
    name: "${nom} - Conso journalière anormale"
    device_class: problem
    lambda: |-
      if (!id(v${i}_conso_jour).has_state()) return false;
      return id(v${i}_conso_jour).state > id(seuil_jour_l).state;
  - platform: template
    id: v${i}_silencieux
    name: "${nom} - Compteur silencieux"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      auto now = id(ha_time).now();
      if (!now.is_valid() || id(v${i}_rx_ts) == 0) return false;
      return ((uint32_t) now.timestamp - id(v${i}_rx_ts)) > (uint32_t) id(seuil_silence_h).state * 3600;
